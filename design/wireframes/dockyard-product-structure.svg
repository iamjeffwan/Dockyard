<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1120" viewBox="0 0 1660 1120">
  <style>
    .page { fill: #f7f7f5; }
    .frame { fill: #fff; stroke: #222; stroke-width: 2; }
    .line { fill: none; stroke: #333; stroke-width: 2; }
    .thin { fill: none; stroke: #999; stroke-width: 1.5; }
    .fill { fill: #e8e8e5; stroke: #444; stroke-width: 1.5; }
    .dark { fill: #333; }
    .title { font: 700 20px Arial, sans-serif; fill: #111; }
    .label { font: 600 14px Arial, sans-serif; fill: #222; }
    .small { font: 12px Arial, sans-serif; fill: #555; }
    .tiny { font: 11px Arial, sans-serif; fill: #666; }
    .center { text-anchor: middle; }
  </style>

  <rect class="page" width="1660" height="1120"/>
  <text x="40" y="38" class="title">Dockyard 产品结构线稿</text>
  <text x="40" y="62" class="small">轻量项目工作区：图稿、组件、Token 和设计决策</text>

  <!-- Screen 1: project shell -->
  <g transform="translate(40 96)">
    <text x="0" y="0" class="title">1 / 项目工作区</text>
    <text x="0" y="22" class="small">Dockyard 的主壳，不做复杂项目管理后台</text>
    <rect class="frame" x="0" y="42" width="500" height="830" rx="4"/>
    <rect class="fill" x="0" y="42" width="500" height="58"/>
    <text x="22" y="78" class="label">DOCKYARD</text>
    <text x="168" y="78" class="small">项目：Dockyard</text>
    <rect class="frame" x="368" y="58" width="112" height="28"/>
    <text x="424" y="77" class="tiny center">切换项目</text>

    <rect class="fill" x="0" y="100" width="122" height="772"/>
    <text x="22" y="132" class="small">当前项目</text>
    <text x="22" y="158" class="label">Dockyard</text>
    <line class="thin" x1="20" y1="180" x2="102" y2="180"/>
    <text x="22" y="214" class="small">工作区</text>
    <rect class="dark" x="14" y="228" width="94" height="38"/>
    <text x="61" y="252" fill="#fff" class="small center">图稿</text>
    <rect class="frame" x="14" y="276" width="94" height="38"/>
    <text x="61" y="300" class="small center">组件</text>
    <rect class="frame" x="14" y="324" width="94" height="38"/>
    <text x="61" y="348" class="small center">Token</text>
    <rect class="frame" x="14" y="372" width="94" height="38"/>
    <text x="61" y="396" class="small center">决策</text>
    <line class="thin" x1="20" y1="442" x2="102" y2="442"/>
    <text x="22" y="476" class="small">当前图稿</text>
    <text x="22" y="506" class="tiny">组件检索页</text>
    <text x="22" y="532" class="tiny">图稿编辑器</text>
    <text x="22" y="558" class="tiny">工具条</text>

    <rect class="line" x="140" y="122" width="344" height="704"/>
    <text x="160" y="154" class="label">组件检索页</text>
    <text x="160" y="178" class="small">当前图稿 / 标注画板</text>
    <rect class="fill" x="160" y="204" width="304" height="386"/>
    <rect class="frame" x="186" y="236" width="252" height="76"/>
    <rect class="frame" x="186" y="338" width="166" height="154"/>
    <rect class="frame" x="366" y="338" width="72" height="154"/>
    <text x="312" y="552" class="tiny center">图稿和标注主区域</text>
    <rect class="frame" x="160" y="618" width="144" height="44"/>
    <text x="232" y="646" class="small center">打开组件检索</text>
    <rect class="dark" x="320" y="618" width="144" height="44"/>
    <text x="392" y="646" fill="#fff" class="small center">发送给开发助手</text>
    <text x="160" y="706" class="tiny">图稿状态：已保存</text>
    <text x="160" y="730" class="tiny">已采用组件：3</text>
  </g>

  <!-- Screen 2: token manager -->
  <g transform="translate(580 96)">
    <text x="0" y="0" class="title">2 / Token 管理和预览</text>
    <text x="0" y="22" class="small">核心价值：看到项目真正使用了哪些 Token 和具体值</text>
    <rect class="frame" x="0" y="42" width="500" height="830" rx="4"/>
    <rect class="fill" x="0" y="42" width="500" height="58"/>
    <text x="22" y="78" class="label">项目 Token</text>
    <text x="190" y="78" class="small">已使用 34 个</text>
    <rect class="frame" x="348" y="58" width="132" height="28"/>
    <text x="414" y="77" class="tiny center">刷新项目状态</text>

    <rect class="fill" x="0" y="100" width="132" height="772"/>
    <text x="20" y="134" class="small">Token 类别</text>
    <rect class="dark" x="14" y="152" width="104" height="34"/>
    <text x="66" y="174" fill="#fff" class="small center">color</text>
    <rect class="frame" x="14" y="194" width="104" height="34"/>
    <text x="66" y="216" class="small center">typography</text>
    <rect class="frame" x="14" y="236" width="104" height="34"/>
    <text x="66" y="258" class="small center">spacing</text>
    <rect class="frame" x="14" y="278" width="104" height="34"/>
    <text x="66" y="300" class="small center">sizing</text>
    <rect class="frame" x="14" y="320" width="104" height="34"/>
    <text x="66" y="342" class="small center">shape</text>
    <rect class="frame" x="14" y="362" width="104" height="34"/>
    <text x="66" y="384" class="small center">motion</text>
    <rect class="frame" x="14" y="404" width="104" height="34"/>
    <text x="66" y="426" class="small center">interaction</text>

    <rect class="line" x="150" y="122" width="330" height="412"/>
    <text x="170" y="154" class="label">color</text>
    <text x="170" y="178" class="tiny">当前项目实际使用的颜色</text>
    <line class="thin" x1="170" y1="198" x2="460" y2="198"/>
    <text x="170" y="228" class="small">Token</text>
    <text x="340" y="228" class="small">值</text>
    <text x="418" y="228" class="small">使用</text>
    <line class="thin" x1="170" y1="242" x2="460" y2="242"/>
    <text x="170" y="272" class="tiny">canvas.background</text>
    <rect class="dark" x="340" y="258" width="46" height="22"/>
    <text x="396" y="274" class="tiny">#101516</text>
    <text x="444" y="274" class="tiny">5</text>
    <line class="thin" x1="170" y1="292" x2="460" y2="292"/>
    <text x="170" y="322" class="tiny">panel.background</text>
    <rect class="fill" x="340" y="308" width="46" height="22"/>
    <text x="396" y="324" class="tiny">#151e1f</text>
    <text x="444" y="324" class="tiny">8</text>
    <line class="thin" x1="170" y1="342" x2="460" y2="342"/>
    <text x="170" y="372" class="tiny">button.primary</text>
    <rect class="fill" x="340" y="358" width="46" height="22"/>
    <text x="396" y="374" class="tiny">#63f4e2</text>
    <text x="444" y="374" class="tiny">3</text>
    <line class="thin" x1="170" y1="392" x2="460" y2="392"/>
    <text x="170" y="422" class="tiny">text.muted</text>
    <rect class="fill" x="340" y="408" width="46" height="22"/>
    <text x="396" y="424" class="tiny">#82908b</text>
    <text x="444" y="424" class="tiny">12</text>
    <rect class="frame" x="150" y="556" width="330" height="270"/>
    <text x="170" y="588" class="label">Token 预览</text>
    <rect class="fill" x="170" y="610" width="290" height="126"/>
    <rect class="frame" x="192" y="632" width="96" height="32"/>
    <rect class="dark" x="304" y="632" width="112" height="32"/>
    <rect class="frame" x="192" y="686" width="224" height="24"/>
    <text x="315" y="756" class="tiny center">真实组件预览</text>
    <text x="170" y="792" class="tiny">点击 Token 可查看受影响组件</text>
  </g>

  <!-- Screen 3: decisions -->
  <g transform="translate(1120 96)">
    <text x="0" y="0" class="title">3 / 设计决策</text>
    <text x="0" y="22" class="small">只保存与 Token 和组件变化有关的决定</text>
    <rect class="frame" x="0" y="42" width="500" height="830" rx="4"/>
    <rect class="fill" x="0" y="42" width="500" height="58"/>
    <text x="22" y="78" class="label">设计决策</text>
    <text x="190" y="78" class="small">已确认 8 条</text>
    <rect class="frame" x="348" y="58" width="132" height="28"/>
    <text x="414" y="77" class="tiny center">新增决策</text>

    <rect class="fill" x="0" y="100" width="150" height="772"/>
    <text x="20" y="134" class="small">历史记录</text>
    <rect class="dark" x="14" y="152" width="122" height="64"/>
    <text x="26" y="178" fill="#fff" class="small">主按钮颜色</text>
    <text x="26" y="198" fill="#fff" class="tiny">已确认</text>
    <rect class="frame" x="14" y="228" width="122" height="64"/>
    <text x="26" y="254" class="small">卡片间距</text>
    <text x="26" y="274" class="tiny">已确认</text>
    <rect class="frame" x="14" y="304" width="122" height="64"/>
    <text x="26" y="330" class="small">拖入反馈</text>
    <text x="26" y="350" class="tiny">已确认</text>
    <text x="20" y="410" class="small">筛选</text>
    <text x="26" y="438" class="tiny">全部</text>
    <text x="26" y="462" class="tiny">Token 变更</text>
    <text x="26" y="486" class="tiny">组件变更</text>
    <text x="26" y="510" class="tiny">动效变更</text>

    <rect class="line" x="168" y="122" width="312" height="704"/>
    <text x="188" y="154" class="label">主按钮颜色</text>
    <text x="188" y="178" class="tiny">2026-08-22 / 组件检索页</text>
    <rect class="fill" x="188" y="204" width="272" height="112"/>
    <text x="204" y="232" class="small">用户目标</text>
    <text x="204" y="260" class="tiny">按钮太亮，希望更克制，</text>
    <text x="204" y="282" class="tiny">但保留主要操作的强调作用。</text>
    <text x="188" y="354" class="small">Token 变更</text>
    <text x="188" y="382" class="tiny">color.button.primary</text>
    <text x="188" y="406" class="tiny">#63f4e2  →  #8ab4ff</text>
    <text x="188" y="444" class="small">影响组件</text>
    <text x="188" y="472" class="tiny">SearchButton</text>
    <text x="188" y="496" class="tiny">ContextButton</text>
    <text x="188" y="534" class="small">结果</text>
    <rect class="frame" x="188" y="552" width="272" height="104"/>
    <rect class="fill" x="208" y="576" width="90" height="28"/>
    <rect class="dark" x="316" y="576" width="90" height="28"/>
    <text x="352" y="632" class="tiny center">已确认的最终状态</text>
    <line class="thin" x1="188" y1="682" x2="460" y2="682"/>
    <text x="188" y="714" class="tiny">来源：Jakub Skill 候选 B</text>
    <text x="188" y="738" class="tiny">状态：已保存到项目 Token</text>
    <rect class="frame" x="188" y="764" width="128" height="38"/>
    <text x="252" y="788" class="tiny center">查看受影响组件</text>
    <rect class="frame" x="328" y="764" width="132" height="38"/>
    <text x="394" y="788" class="tiny center">查看 Token</text>
  </g>
</svg>
