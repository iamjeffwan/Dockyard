<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <style>
    .page { fill: #f7f7f5; }
    .frame { fill: #fff; stroke: #222; stroke-width: 2; }
    .line { fill: none; stroke: #333; stroke-width: 2; }
    .thin { fill: none; stroke: #888; stroke-width: 1.5; }
    .fill { fill: #e8e8e5; stroke: #444; stroke-width: 1.5; }
    .dark { fill: #333; }
    .title { font: 700 20px Arial, sans-serif; fill: #111; }
    .label { font: 600 14px Arial, sans-serif; fill: #222; }
    .small { font: 12px Arial, sans-serif; fill: #555; }
    .tiny { font: 11px Arial, sans-serif; fill: #666; }
    .center { text-anchor: middle; }
  </style>

  <rect class="page" width="1600" height="1040"/>
  <text x="40" y="38" class="title">Dockyard 工作流管理线稿：三种结构方向</text>
  <text x="40" y="62" class="small">只讨论信息层级和操作位置，不代表正式视觉设计。</text>

  <!-- Option A -->
  <g transform="translate(40 92)">
    <rect class="frame" width="480" height="890" rx="4"/>
