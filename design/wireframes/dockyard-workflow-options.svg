    <rect class="fill" x="18" y="76" width="444" height="74"/>
    <text x="32" y="100" class="label">设计流程</text>
    <line class="line" x1="42" y1="126" x2="432" y2="126"/>
    <circle cx="62" cy="126" r="11" fill="#333"/>
    <circle cx="160" cy="126" r="11" fill="#333"/>
    <circle cx="258" cy="126" r="11" fill="#333"/>
    <circle cx="356" cy="126" r="11" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="432" cy="126" r="11" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="62" y="112" class="tiny center">线框</text>
    <text x="160" y="112" class="tiny center">初版</text>
    <text x="258" y="112" class="tiny center">审查</text>
