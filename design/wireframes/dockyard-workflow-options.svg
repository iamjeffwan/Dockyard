    <text x="239" y="210" class="small center">当前版本</text>
    <rect class="fill" x="164" y="230" width="150" height="180"/>
    <rect class="frame" x="184" y="256" width="110" height="38"/>
    <rect class="dark" x="184" y="320" width="110" height="28"/>
