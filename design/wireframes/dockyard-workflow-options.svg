    <rect class="frame" x="162" y="494" width="166" height="44"/>
    <text x="180" y="521" class="small">[开始审查]</text>
    <rect class="frame" x="162" y="554" width="166" height="44"/>
    <text x="180" y="581" class="small">[继续设计]</text>
    <text x="162" y="646" class="label">最近活动</text>
    <line class="thin" x1="162" y1="664" x2="328" y2="664"/>
    <line class="thin" x1="162" y1="690" x2="328" y2="690"/>
    <line class="thin" x1="162" y1="716" x2="328" y2="716"/>
