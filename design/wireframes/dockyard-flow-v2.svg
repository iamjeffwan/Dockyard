<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><style>.bg{fill:#0b0e0f}.box{fill:#172021;stroke:#6d7b76;stroke-width:2}.active{fill:#e7ff63;stroke:#e7ff63;stroke-width:2}.line{stroke:#63f4e2;stroke-width:3;fill:none;marker-end:url(#arrow)}.text{fill:#f4f2eb;font:700 20px Arial,sans-serif}.small{fill:#aab6b1;font:15px Arial,sans-serif}.mono{fill:#82908b;font:13px 'Courier New',monospace}.label{fill:#0b0e0f;font:700 15px Arial,sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63f4e2"/></marker></defs><rect class="bg" width="1500" height="760"/><text class="text" x="60" y="62">Dockyard / 用户流程方向 v2</text><text class="small" x="60" y="90">项目是上下文，图稿是画布内容；功能模块都从工作条进入</text><rect class="active" x="60" y="180" width="220" height="120" rx="16"/><text class="label" x="92" y="225">选择项目文件夹</text><text class="label" x="92" y="250">和工作区</text><text class="label" x="92" y="278">只设置一次上下文</text><path class="line" d="M280 240h120"/><rect class="box" x="400" y="180" width="220" height="120" rx="16"/><text class="text" x="438" y="225">打开工作条</text><text class="small" x="438" y="253">显示功能模块</text><text class="mono" x="438" y="278">artboard / components / tokens / decisions</text><path class="line" d="M620 240h120"/><rect class="box" x="740" y="180" width="220" height="120" rx="16"/><text class="text" x="790" y="225">进入画板</text><text class="small" x="790" y="253">纯画布</text><text class="mono" x="790" y="278">no side panels</text><path class="line" d="M960 240h120"/><rect class="box" x="1080" y="180" width="220" height="120" rx="16"/><text class="text" x="1122" y="225">下方打开组件</text><text class="small" x="1122" y="253">仍在同一画板上下文</text><text class="mono" x="1122" y="278">bottom tray</text><path class="line" d="M850 300v140"/><rect class="box" x="740" y="440" width="220" height="120" rx="16"/><text class="text" x="790" y="485">点击 Token</text><text class="small" x="790" y="513">工作条延展</text><text class="mono" x="790" y="538">compact popover</text><path class="line" d="M960 500h120"/><rect class="box" x="1080" y="440" width="220" height="120" rx="16"/><text class="text" x="1124" y="485">点击决策</text><text class="small" x="1124" y="513">工作条延展</text><text class="mono" x="1124" y="538">impact / status</text><text class="small" x="60" y="680">原则：项目文件夹不是图稿列表；图稿不需要管理侧栏；Token 与决策不升级成独立后台页面。</text></svg>
