    .thin { fill: none; stroke: #888; stroke-width: 1.5; }
    .fill { fill: #e8e8e5; stroke: #444; stroke-width: 1.5; }
    .dark { fill: #333; }
    .title { font: 700 20px Arial, sans-serif; fill: #111; }
    .label { font: 600 14px Arial, sans-serif; fill: #222; }
    .small { font: 12px Arial, sans-serif; fill: #555; }
    .tiny { font: 11px Arial, sans-serif; fill: #666; }
    .center { text-anchor: middle; }
  </style>

  <rect class="page" width="1440" height="900"/>
