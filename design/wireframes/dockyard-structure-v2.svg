<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<style>.bg{fill:#0b0e0f}.frame{fill:#111617;stroke:#6d7b76;stroke-width:2}.panel{fill:#172021;stroke:#53615d;stroke-width:2}.light{fill:#202d2c;stroke:#53615d;stroke-width:2}.fine{stroke:#53615d;stroke-width:1.5;fill:none}.accent{fill:#e7ff63;stroke:#e7ff63}.cyan{fill:#63f4e2;stroke:#63f4e2}.text{fill:#f4f2eb;font:600 18px Arial,sans-serif}.small{fill:#aab6b1;font:14px Arial,sans-serif}.mono{fill:#82908b;font:13px 'Courier New',monospace}.title{fill:#f4f2eb;font:700 26px Arial,sans-serif}.label{fill:#0b0e0f;font:700 14px Arial,sans-serif}.arrow{stroke:#63f4e2;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63f4e2"/></marker></defs><rect class="bg" width="1500" height="1040"/>
<text class="title" x="60" y="58">Dockyard / structure direction v2</text><text class="small" x="60" y="86">功能模块在工作条；画板保持纯画布；附加功能沿上下文展开</text>
<rect class="frame" x="60" y="125" width="1380" height="126" rx="24"/><rect class="accent" x="84" y="151" width="48" height="48" rx="10"/><text class="label" x="101" y="181">D</text><text class="text" x="150" y="170">Dockyard</text><text class="mono" x="150" y="193">workspace / dockyard</text><rect class="light" x="365" y="148" width="225" height="54" rx="12"/><text class="small" x="385" y="170">当前项目文件夹</text><text class="text" x="385" y="190">Dockyard  ›</text><path class="fine" d="M612 143v68"/>
<rect class="panel" x="635" y="145" width="134" height="60" rx="12"/><rect class="panel" x="781" y="145" width="134" height="60" rx="12"/><rect class="panel" x="927" y="145" width="134" height="60" rx="12"/><rect class="panel" x="1073" y="145" width="134" height="60" rx="12"/><rect class="cyan" x="1235" y="159" width="38" height="38" rx="10"/><text class="label" x="1247" y="184">+</text><text class="text" x="658" y="173">画板</text><text class="mono" x="658" y="191">ARTBOARD</text><text class="text" x="804" y="173">组件</text><text class="mono" x="804" y="191">COMPONENTS</text><text class="text" x="950" y="173">Token</text><text class="mono" x="950" y="191">TOKENS</text><text class="text" x="1096" y="173">决策</text><text class="mono" x="1096" y="191">DECISIONS</text><text class="small" x="1295" y="173">工作条主体 = 功能模块</text><text class="mono" x="1295" y="194">project context is not an artwork</text>
<text class="title" x="60" y="308">A. 画板：纯画布</text><rect class="frame" x="60" y="335" width="640" height="450" rx="14"/><rect class="light" x="80" y="355" width="600" height="44" rx="9"/><text class="small" x="102" y="383">当前图稿：homepage-reference.png</text><text class="mono" x="548" y="383">保存  ·  关闭</text><rect x="80" y="415" width="600" height="350" fill="#101516" stroke="#53615d" stroke-width="1"/><path class="fine" d="M100 455h560M100 495h560M100 535h560M100 575h560M100 615h560M100 655h560M100 695h560M100 735h560M140 435v310M180 435v310M220 435v310M260 435v310M300 435v310M340 435v310M380 435v310M420 435v310M460 435v310M500 435v310M540 435v310M580 435v310M620 435v310" opacity=".35"/><text class="small" x="282" y="600">Excalidraw 画布</text><text class="mono" x="96" y="814">无 Dockyard 左栏 / 右栏 / 上下检查器</text><path class="arrow" d="M720 538C795 538 795 420 865 420"/><text class="small" x="745" y="505">画板只负责画板</text>
<text class="title" x="860" y="308">B. 组件：画板下方附加</text><rect class="frame" x="860" y="335" width="580" height="450" rx="14"/><rect class="light" x="880" y="355" width="540" height="180" rx="9"/><text class="small" x="900" y="383">上方仍是同一块画布</text><path class="fine" d="M900 425h500M900 465h500M900 505h500" opacity=".5"/><rect class="panel" x="880" y="551" width="540" height="214" rx="9"/><text class="text" x="900" y="581">组件检索</text><text class="mono" x="1260" y="581">DRAW → SEARCH → ADD</text><rect class="light" x="900" y="600" width="500" height="38" rx="7"/><text class="small" x="918" y="625">输入组件描述或选择组件库</text><rect class="panel" x="900" y="653" width="150" height="82" rx="7"/><rect class="panel" x="1065" y="653" width="150" height="82" rx="7"/><rect class="panel" x="1230" y="653" width="150" height="82" rx="7"/><text class="small" x="930" y="695">候选 A</text><text class="small" x="1095" y="695">候选 B</text><text class="small" x="1260" y="695">候选 C</text><text class="mono" x="900" y="812">单独打开时仍是底部抽屉，不切换成新页面</text>
<text class="title" x="60" y="868">C. Token / 决策：从工作条延展</text><rect class="frame" x="60" y="895" width="1380" height="105" rx="18"/><rect class="panel" x="84" y="915" width="290" height="65" rx="10"/><text class="text" x="105" y="943">Token 轻量展开层</text><text class="mono" x="105" y="963">color / spacing / motion</text><rect class="panel" x="398" y="915" width="290" height="65" rx="10"/><text class="text" x="419" y="943">决策轻量展开层</text><text class="mono" x="419" y="963">why / impact / status</text><path class="arrow" d="M730 947h130"/><text class="small" x="884" y="940">点击工作条里的 Token 或决策模块</text><text class="small" x="884" y="964">只展开信息，不打开完整工作页面</text></svg>
