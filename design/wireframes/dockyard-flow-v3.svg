<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><style>.bg{fill:#0b0e0f}.box{fill:#172021;stroke:#6d7b76;stroke-width:2}.active{fill:#e7ff63;stroke:#e7ff63;stroke-width:2}.line{stroke:#63f4e2;stroke-width:3;fill:none;marker-end:url(#arrow)}.text{fill:#f4f2eb;font:700 19px Arial,sans-serif}.small{fill:#aab6b1;font:15px Arial,sans-serif}.mono{fill:#82908b;font:13px 'Courier New',monospace}.label{fill:#0b0e0f;font:700 15px Arial,sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63f4e2"/></marker></defs><rect class="bg" width="1500" height="760"/><text class="text" x="60" y="62">Dockyard / 用户流程方向 v3</text><text class="small" x="60" y="90">工作条统一入口；组件检索只在展开层里出现Excalidraw 小画板和候选</text><rect class="active" x="60" y="180" width="220" height="120" rx="16"/><text class="label" x="92" y="225">选择项目文件夹</text><text class="label" x="92" y="250">和工作区</text><text class="label" x="92" y="278">设置上下文</text><path class="line" d="M280 240h100"/><rect class="box" x="380" y="180" width="220" height="120" rx="16"/><text class="text" x="426" y="225">打开工作条</text><text class="small" x="426" y="253">看到四个功能模块</text><text class="mono" x="426" y="278">artboard / components / tokens / decisions</text><path class="line" d="M600 240h100"/><rect class="box" x="700" y="180" width="220" height="120" rx="16"/><text class="text" x="750" y="225">点击组件</text><text class="small" x="750" y="253">工作条展开</text><text class="mono" x="750" y="278">not a new page</text><path class="line" d="M920 240h100"/><rect class="box" x="1020" y="180" width="260" height="120" rx="16"/><text class="text" x="1054" y="225">Excalidraw 小画板 + 候选</text><text class="small" x="1054" y="253">画草图、检索、选择</text><text class="mono" x="1054" y="278">draw -> search -> add</text><path class="line" d="M1150 300v110"/><rect class="box" x="1020" y="410" width="260" height="120" rx="16"/><text class="text" x="1060" y="455">添加到正式画板</text><text class="small" x="1060" y="483">正式画板仍然纯净</text><text class="mono" x="1060" y="508">canvas stays separate</text><path class="line" d="M920 520H760"/><rect class="box" x="500" y="460" width="220" height="120" rx="16"/><text class="text" x="550" y="505">Token / 决策</text><text class="small" x="550" y="533">同样由工作条展开</text><text class="mono" x="550" y="558">compact popover</text><text class="small" x="60" y="680">项目文件夹 = 上下文；正式画板 = 纯画布；组件、Token、决策 = 工作条展开层。</text></svg>
